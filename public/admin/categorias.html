            Meu perfil
            <span class="ml-auto text-[9px] tracked-sm text-stone/60">EM BREVE</span>
          </button>
          <button type="button" data-soon="Preferências" class="soon-link w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-ink/80 hover:bg-black/[0.03] text-left">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-stone" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.49l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.49l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>

    <main class="px-5 md:px-10 py-8 max-w-[900px]">

      <div class="mb-6">
        <p class="tracked-sm text-[11px] text-gold font-semibold mb-2">CATEGORIAS</p>
        <h2 class="font-serif text-4xl md:text-5xl leading-none mb-3">Categorias de produtos</h2>
        <p class="text-stone text-sm md:text-base">Essas são as opções usadas no formulário de produto e nos filtros do catálogo. Você pode criar novas ou renomear uma existente.</p>
      </div>

      <!-- Nova categoria -->
      <form id="new-category-form" class="flex flex-col sm:flex-row gap-3 mb-6 bg-white rounded-2xl border border-black/5 p-4 md:p-5">
        <input id="new-category-input" type="text" placeholder="Nome da nova categoria" required class="flex-1 bg-white border border-black/10 rounded-xl px-4 py-3 text-sm placeholder:text-stone/60 focus:outline-none focus:ring-2 focus:ring-forest/20" />

          Adicionar categoria

      <p id="form-error" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-100 rounded-lg px-3 py-2 mb-6"></p>

      <!-- Lista -->
      <div class="bg-white rounded-2xl border border-black/5 divide-y divide-black/5" id="category-list">
        <p class="p-6 text-sm text-stone text-center">Carregando categorias…</p>
      </div>

<script>
  (async function checkSession() {
    try {
      const res = await fetch('/api/me', { credentials: 'include' });
      if (!res.ok) { window.location.replace('/login.html'); return; }
      const { user } = await res.json();
      document.getElementById('user-name').textContent = user.name || 'Administrador';
      document.getElementById('user-role').textContent = user.role || 'Administrador';
      document.getElementById('user-avatar').textContent = (user.name || 'A').charAt(0).toUpperCase();
    } catch (err) {
      window.location.replace('/login.html');
    }
  })();

  async function doLogout() {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    window.location.href = '/login.html';
  }
  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); doLogout(); });
  document.getElementById('logout-link-top').addEventListener('click', (e) => { e.preventDefault(); doLogout(); });

  document.querySelectorAll('.soon-link').forEach(btn => {
    btn.addEventListener('click', () => {
      alert(`"${btn.dataset.soon}" ainda não foi implementado nesta versão.`);
    });
  });

  const userMenuBtn = document.getElementById('user-menu-btn');
  const userMenu = document.getElementById('user-menu');
  userMenuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = !userMenu.classList.contains('hidden');
    userMenu.classList.toggle('hidden', isOpen);
    userMenuBtn.setAttribute('aria-expanded', String(!isOpen));
  });
  document.addEventListener('click', (e) => {
    if (!document.getElementById('user-menu-wrap').contains(e.target)) {
      userMenu.classList.add('hidden');
      userMenuBtn.setAttribute('aria-expanded', 'false');
    }
  });

  // ---------- Categorias ----------
  const listEl = document.getElementById('category-list');
  const formError = document.getElementById('form-error');
  const newForm = document.getElementById('new-category-form');
  const newInput = document.getElementById('new-category-input');

  function showError(msg) {
    formError.textContent = msg;
    formError.classList.remove('hidden');
  }
  function hideError() {
    formError.classList.add('hidden');
  }

  function renderList(categories) {
    if (categories.length === 0) {
      listEl.innerHTML = `<p class="p-6 text-sm text-stone text-center">Nenhuma categoria cadastrada ainda.</p>`;
      return;
    }
    listEl.innerHTML = categories.map(c => `
      <div class="flex items-center gap-3 px-5 py-4" data-id="${c.id}">
        <input type="text" value="${c.title.replace(/"/g, '&quot;')}" class="category-title-input flex-1 bg-white border border-transparent hover:border-black/10 focus:border-black/20 rounded-lg px-3 py-2 text-sm focus:outline-none transition" />
        <button type="button" class="save-title-btn shrink-0 text-xs font-medium text-forest hover:underline hidden">Salvar</button>
        <span class="saved-check hidden text-emerald-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
        </span>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-id]').forEach(row => {
      const id = row.dataset.id;
      const input = row.querySelector('.category-title-input');
      const saveBtn = row.querySelector('.save-title-btn');
      const savedCheck = row.querySelector('.saved-check');
      const original = input.value;

      input.addEventListener('input', () => {
        savedCheck.classList.add('hidden');
        saveBtn.classList.toggle('hidden', input.value.trim() === original || input.value.trim() === '');
      });

      saveBtn.addEventListener('click', async () => {
        const title = input.value.trim();
        if (!title) return;
        hideError();
        try {
          const res = await fetch(`/api/categories/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ title }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Não foi possível salvar.');
          saveBtn.classList.add('hidden');
          savedCheck.classList.remove('hidden');
          setTimeout(() => savedCheck.classList.add('hidden'), 1800);
        } catch (err) {
          showError(err.message);
        }
      });
    });
  }

  async function loadCategories() {
    try {
      const res = await fetch('/api/categories');
      const data = await res.json();
      renderList(data.categories || []);
    } catch (err) {
      listEl.innerHTML = `<p class="p-6 text-sm text-rose-600 text-center">Não foi possível carregar as categorias.</p>`;
    }
  }

  newForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError();
    const title = newInput.value.trim();
    if (!title) return;

    try {
      const res = await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ title }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Não foi possível criar a categoria.');
      newInput.value = '';
      loadCategories();
    } catch (err) {
      showError(err.message);
    }
  });

  loadCategories();
</script>
</body>
