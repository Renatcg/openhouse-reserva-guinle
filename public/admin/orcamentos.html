<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orçamentos · Admin Reserva Guinle</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#f6f3ec',
          ink: '#1f2a22',
          forest: '#1f3327',
          gold: '#c8a862',
          stone: '#8a8578',
        },
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'serif'],
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-serif { font-family: 'Cormorant Garamond', serif; }
  .tracked-sm { letter-spacing: 0.08em; }
</style>
</head>
<body class="bg-cream text-ink antialiased">

<div class="min-h-screen flex">

  <!-- ===== SIDEBAR ===== -->
  <aside class="hidden lg:block shrink-0 w-[76px] relative">
  <div class="sidebar-panel group absolute inset-y-0 left-0 z-40 w-[76px] hover:w-[250px] flex flex-col bg-forest text-cream/90 overflow-hidden shadow-2xl transition-[width] duration-200 ease-out">
    <div class="px-7 pt-9 pb-6">
      <div class="w-11 h-11 flex items-center justify-center shrink-0 group-hover:hidden">
        <img src="/img/logo-riga-50anos-white.png" alt="Riga" class="w-full h-full object-contain" />
      </div>
      <div class="hidden group-hover:block">
        <img src="/img/logo-riga-50anos-white.png" alt="Riga · 50 anos" class="h-10 w-auto" />
      </div>
    </div>
    <div class="mx-7 h-px bg-white/15 mb-4"></div>

    <nav class="flex-1 px-4 space-y-1">
      <a href="produtos.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-cream/70 hover:bg-white/5 hover:text-white text-sm font-medium transition whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375C2.754 3.75 2.25 4.254 2.25 4.875v1.5c0 .621.504 1.125 1.125 1.125z" /></svg><span class="hidden group-hover:inline whitespace-nowrap">Produtos</span></a>
      <a href="categorias.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-cream/70 hover:bg-white/5 hover:text-white text-sm font-medium transition whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" /></svg><span class="hidden group-hover:inline whitespace-nowrap">Categorias</span></a>
      <a href="orcamentos.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg bg-white/10 text-white text-sm font-medium whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg><span class="hidden group-hover:inline whitespace-nowrap">Orçamentos</span></a>
    </nav>

    <div class="px-4 pb-4">
      <div class="mx-3 h-px bg-white/15 mb-4"></div>
      <a href="#" id="logout-link" class="flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-cream/70 hover:bg-white/5 hover:text-white text-sm font-medium transition whitespace-nowrap">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H2.25" /></svg><span class="hidden group-hover:inline whitespace-nowrap">Sair</span></a>
    </div>
  </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="flex-1 min-w-0">

    <!-- Topbar -->
    <header class="flex items-center gap-4 px-5 md:px-10 py-5 border-b border-black/5 bg-cream/80 backdrop-blur sticky top-0 z-30">
      <button class="lg:hidden w-9 h-9 flex items-center justify-center rounded-lg border border-black/10" aria-label="Menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-ink" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" /></svg>
      </button>
      <div class="ml-auto relative" id="user-menu-wrap">
        <button type="button" id="user-menu-btn" class="flex items-center gap-3" aria-haspopup="true" aria-expanded="false">
          <div class="w-9 h-9 rounded-full bg-forest text-white flex items-center justify-center font-serif text-base" id="user-avatar">?</div>
          <div class="hidden sm:block leading-tight text-left">
            <p class="text-sm font-medium" id="user-name">—</p>
            <p class="text-xs text-stone" id="user-role">—</p>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-stone" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" /></svg>
        </button>
        <div id="user-menu" class="hidden absolute right-0 top-full mt-2 w-52 bg-white rounded-xl border border-black/5 shadow-lg py-1.5 z-40">
          <button type="button" id="logout-link-top" class="w-full flex items-center gap-2.5 px-4 py-2.5 text-sm text-rose-600 hover:bg-rose-50 text-left">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l3 3m0 0l-3 3m3-3H2.25" /></svg>
            Sair
          </button>
        </div>
      </div>
    </header>

    <main class="px-5 md:px-10 py-8 max-w-[1400px]">

      <div class="mb-6">
        <p class="tracked-sm text-[11px] text-gold font-semibold mb-2">ORÇAMENTOS</p>
        <h2 class="font-serif text-4xl md:text-5xl leading-none mb-3">Solicitações de orçamento</h2>
        <p class="text-stone text-sm md:text-base">Pessoas que selecionaram itens no catálogo e pediram orçamento pelo WhatsApp.</p>
      </div>

      <div class="bg-white rounded-2xl border border-black/5 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm min-w-[760px]">
            <thead>
              <tr class="bg-black/[0.02] text-left text-stone text-xs tracked-sm border-b border-black/5">
                <th class="py-3 px-5 font-medium">SOLICITANTE</th>
                <th class="py-3 px-3 font-medium">CONTATO</th>
                <th class="py-3 px-3 font-medium">ITENS</th>
                <th class="py-3 px-3 font-medium">DATA</th>
                <th class="py-3 px-5 font-medium text-right">AÇÕES</th>
              </tr>
            </thead>
            <tbody id="table-body" class="divide-y divide-black/5"></tbody>
          </table>
        </div>
        <p id="empty-state" class="hidden text-center text-stone text-sm py-12">Nenhuma solicitação de orçamento ainda.</p>
      </div>
    </main>
  </div>
</div>

<script>
  (async function checkSession() {
    try {
      const res = await fetch('/api/me', { credentials: 'include' });
      if (!res.ok) { window.location.replace('/login.html'); return; }
      const { user } = await res.json();
      document.getElementById('user-name').textContent = user.name || 'Administrador';
      document.getElementById('user-role').textContent = user.role || 'Administrador';
      document.getElementById('user-avatar').textContent = (user.name || 'A').charAt(0).toUpperCase();
    } catch (err) {
      window.location.replace('/login.html');
    }
  })();

  async function doLogout() {
    await fetch('/api/logout', { method: 'POST', credentials: 'include' });
    window.location.href = '/login.html';
  }
  document.getElementById('logout-link').addEventListener('click', (e) => { e.preventDefault(); doLogout(); });
  document.getElementById('logout-link-top').addEventListener('click', (e) => { e.preventDefault(); doLogout(); });

  const userMenuBtn = document.getElementById('user-menu-btn');
  const userMenu = document.getElementById('user-menu');
  userMenuBtn.addEventListener('click', () => userMenu.classList.toggle('hidden'));
  document.addEventListener('click', (e) => {
    if (!userMenuBtn.contains(e.target) && !userMenu.contains(e.target)) userMenu.classList.add('hidden');
  });

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function digitsOnly(s) { return (s || '').replace(/\D/g, ''); }

  async function loadQuotes() {
    const tbody = document.getElementById('table-body');
    const emptyState = document.getElementById('empty-state');
    try {
      const res = await fetch('/api/quotes', { credentials: 'include' });
      const data = await res.json();
      const list = data.quotes || [];

      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      tbody.innerHTML = list.map(q => {
        const itemsLabel = q.items.length === 1 ? '1 item' : `${q.items.length} itens`;
        const itemsTitle = q.items.map(i => i.title).join(', ');
        const waPhone = digitsOnly(q.phone);
        const waUrl = `https://wa.me/${waPhone}`;
        const publicUrl = `${window.location.origin}/orcamento.html?q=${q.id}`;

        return `
          <tr>
            <td class="py-3.5 px-5 font-medium text-ink">${q.name}</td>
            <td class="py-3.5 px-3 text-stone">
              <div>${q.email}</div>
              <div>${q.phone}</div>
            </td>
            <td class="py-3.5 px-3 text-stone" title="${itemsTitle.replace(/"/g, '&quot;')}">${itemsLabel}</td>
            <td class="py-3.5 px-3 text-stone whitespace-nowrap">${formatDate(q.createdAt)}</td>
            <td class="py-3.5 px-5 text-right whitespace-nowrap">
              <a href="${publicUrl}" target="_blank" class="text-forest hover:underline text-sm mr-4">Ver seleção</a>
              <a href="${waUrl}" target="_blank" class="text-forest hover:underline text-sm">WhatsApp</a>
            </td>
          </tr>
        `;
      }).join('');
    } catch (err) {
      emptyState.textContent = 'Não foi possível carregar as solicitações agora.';
      emptyState.classList.remove('hidden');
    }
  }

  loadQuotes();
</script>
</body>
</html>
