<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sua confirmação · Open House Reserva Guinle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream: '#f6f3ec',
          ink: '#1f2a22',
          forest: '#1f3327',
          gold: '#c8a862',
          stone: '#8a8578',
        },
        fontFamily: {
          serif: ['"Cormorant Garamond"', 'serif'],
          sans: ['Inter', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-serif { font-family: 'Cormorant Garamond', serif; }
  .tracked-sm { letter-spacing: 0.08em; }
  .riga-mark { filter: brightness(0) saturate(100%) invert(14%) sepia(17%) saturate(1247%) hue-rotate(93deg) brightness(94%) contrast(93%); opacity: 0.85; }
</style>
</head>
<body class="bg-cream text-ink antialiased">

  <!-- ===== HEADER ===== -->
  <header class="max-w-7xl mx-auto flex items-center justify-between px-5 md:px-10 pt-4 pb-2 gap-4">
    <div>
      <img src="/img/logo-reserva-guinle.png" alt="Reserva Guinle" class="h-20 md:h-24 w-auto" />
    </div>
    <button id="calendar-btn" class="shrink-0 inline-flex items-center gap-2 bg-white border border-black/10 text-ink px-5 py-2.5 rounded-full text-sm font-medium hover:bg-black/[0.03] transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
      Adicionar ao meu calendário
    </button>
  </header>

  <!-- ===== ESTADO: CARREGANDO / INVÁLIDO ===== -->
  <section id="state-loading" class="max-w-2xl mx-auto px-5 md:px-10 py-24 text-center">
    <p class="text-stone text-sm">Carregando…</p>
  </section>

  <section id="state-invalid" class="hidden max-w-2xl mx-auto px-5 md:px-10 py-24 text-center">
    <h2 class="font-serif text-3xl md:text-4xl mb-3">Convite não encontrado</h2>
    <p class="text-stone text-sm md:text-base max-w-md mx-auto mb-6">Este link não é válido.</p>
  </section>

  <!-- ===== ALREADY-CONFIRMED SECTION ===== -->
  <section id="state-confirmed" class="hidden max-w-7xl mx-auto px-5 md:px-10 pb-16">
    <div class="grid lg:grid-cols-[1fr_0.85fr] lg:grid-rows-[1fr_auto] gap-8 lg:gap-x-12 lg:gap-y-0 items-center">

      <div class="py-6 lg:col-start-1 lg:row-start-1">
        <div class="w-10 h-[2px] bg-gold mb-5"></div>
        <h2 class="font-serif text-4xl md:text-5xl leading-[1.08] mb-4">Tudo certo, estamos aqui para você.</h2>
        <p class="text-stone text-base leading-relaxed mb-4 max-w-md" id="confirmed-message">
          Você receberá em breve um e-mail com todas as informações do evento, incluindo endereço, dicas de estacionamento e o que esperar da sua visita.
        </p>

        <div class="flex items-center gap-3 bg-white border border-black/5 rounded-xl p-4 mb-6 max-w-sm">
          <div class="w-10 h-10 rounded-lg bg-forest/[0.06] flex items-center justify-center text-forest shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5" /></svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-ink" id="date-label">—</p>
            <p class="text-xs text-stone" id="weekday-label">—</p>
          </div>
        </div>

      </div>

      <div class="relative rounded-2xl overflow-hidden min-h-[280px] lg:min-h-[480px] lg:col-start-2 lg:row-start-1 lg:row-span-2">
        <img src="https://mauad.net.br/wp-content/uploads/2023/11/GUIN_Jardim-Casa-C_HR.jpg" alt="" class="absolute inset-0 w-full h-full object-cover" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent"></div>
        <div class="absolute bottom-6 left-6">
          <p class="tracked-sm text-[10px] text-white leading-[1.9] font-medium drop-shadow-sm">
            DETALHES<br>QUE TORNAM<br>A VIDA EXTRAORDINÁRIA.
          </p>
        </div>
      </div>

      <!-- ===== ASSINATURAS: MAUAD + RIGA (rodapé do bloco de texto; no mobile, fica no final) ===== -->
      <div class="flex items-center gap-6 pt-8 mt-8 border-t border-black/10 lg:col-start-1 lg:row-start-2 lg:self-start">
        <img src="/img/logo-mauad.png" alt="Mauad" class="h-[19px] md:h-[22px] w-auto" />
        <div class="w-px h-9 bg-black/10"></div>
        <img src="/img/logo-riga-50anos.png" alt="Riga · 50 anos · Design de Interiores" class="riga-mark h-10 md:h-12 w-auto" />
      </div>
    </div>
  </section>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');

  const stateLoading = document.getElementById('state-loading');
  const stateInvalid = document.getElementById('state-invalid');
  const stateConfirmed = document.getElementById('state-confirmed');

  function showState(state) {
    [stateLoading, stateInvalid, stateConfirmed].forEach(s => s.classList.add('hidden'));
    state.classList.remove('hidden');
  }

  async function init() {
    if (!token) { showState(stateInvalid); return; }
    try {
      const res = await fetch(`/api/rsvp/${encodeURIComponent(token)}`);
      if (!res.ok) { showState(stateInvalid); return; }
      const data = await res.json();

      if (data.status !== 'Confirmado') {
        window.location.replace(`confirmar.html?t=${encodeURIComponent(token)}`);
        return;
      }

      document.getElementById('date-label').textContent = data.day.dateLabel;
      document.getElementById('weekday-label').textContent = data.day.weekday;
      if (data.name) {
        const firstName = data.name.trim().split(' ')[0];
        document.getElementById('confirmed-message').textContent =
          `Tudo certo, ${firstName}. Você receberá em breve um e-mail com todas as informações do evento, incluindo endereço, dicas de estacionamento e o que esperar da sua visita.`;
      }

      showState(stateConfirmed);
    } catch (err) {
      showState(stateInvalid);
    }
  }

  function addToCalendar() {
    const title = encodeURIComponent('Open House · Casa Modelo Reserva Guinle');
    const details = encodeURIComponent('Confirmação de presença no Open House da Casa Modelo Reserva Guinle.');
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&details=${details}`;
    window.open(url, '_blank');
  }
  document.getElementById('calendar-btn').addEventListener('click', addToCalendar);

  init();
</script>
</body>
</html>
